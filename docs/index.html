<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DiscordPyoko</title>
    <style>
      .app-icon {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: currentColor;
      }
    </style>
    <script type="module" crossorigin src="/discord-streamkit-layer/assets/index.js"></script>
    <link rel="stylesheet" crossorigin href="/discord-streamkit-layer/assets/index.css">
  </head>
  <body class="dark-theme">
    <div id="app">
      <aside class="sidebar">
        <header class="sidebar-header">
          <div class="header-main">
            <h1>DiscordPyoko</h1>
            <span class="version">v0.0.1</span>
          </div>
          <div class="header-actions">
            <div class="lang-switcher">
              <button class="lang-btn" data-lang="en">EN</button>
              <button class="lang-btn active" data-lang="ja">JA</button>
            </div>
            <a id="download-offline-app" class="btn-icon header-icon" href="./discordpyoko-offline.zip" download title="Download Offline App">
              <svg class="app-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 7.5 12 3l8 4.5v9L12 21l-8-4.5v-9Z"/><path d="M12 12 4.5 7.8"/><path d="m12 12 7.5-4.2"/><path d="M12 12v8.5"/></svg>
            </a>
          </div>
        </header>

        <div class="sidebar-body">
          <nav class="mode-rail" aria-label="Editor panes">
            <button type="button" class="mode-rail-btn active" data-pane-target="presets" title="Presets">
              <svg class="app-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 0 0 18h1.1a1.9 1.9 0 0 0 1.3-3.3 1.9 1.9 0 0 1 1.3-3.3H17a4 4 0 0 0 4-4C21 6.3 17 3 12 3Z"/><circle cx="7.5" cy="10" r="1"/><circle cx="10.5" cy="7.5" r="1"/><circle cx="14.5" cy="7.5" r="1"/><circle cx="16.5" cy="11" r="1"/></svg>
            </button>
            <button type="button" class="mode-rail-btn" data-pane-target="members" title="Members">
              <svg class="app-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M16 19v-1.5a3.5 3.5 0 0 0-3.5-3.5h-5A3.5 3.5 0 0 0 4 17.5V19"/><circle cx="10" cy="8" r="3"/><path d="M20 19v-1.3a3.2 3.2 0 0 0-2.4-3.1"/><path d="M16.3 5.2a3 3 0 0 1 0 5.6"/></svg>
            </button>
            <button type="button" class="mode-rail-btn" data-pane-target="output" title="Output">
              <svg class="app-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="m8 8-4 4 4 4"/><path d="m16 8 4 4-4 4"/><path d="m14 4-4 16"/></svg>
            </button>
          </nav>

          <div class="sidebar-content-wrapper">
            <section class="pane-panel active" data-pane="presets">
              <div class="pane-section-heading">
                <div class="inner-group-title" data-i18n="themes">Presets</div>
              </div>
              <div class="theme-scroll-container">
                <div class="theme-grid" id="theme-selector">
                  <!-- Rendered via main.js -->
                </div>
              </div>

              <div class="pane-section-heading secondary-heading">
                <div class="inner-group-title" data-i18n="livePreview">Preview</div>
              </div>
              <div class="preview-control-grid">
                <button id="toggle-debug" class="switch-control" type="button" role="switch" aria-checked="false">
                  <span class="switch-label" data-i18n="toggleMetadata">Show IDs</span>
                  <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
                </button>
              </div>
              <div id="unset-users-control" class="inline-panel">
                <label for="unset-count" class="mini-label">Unset User Count</label>
                <div class="dual-input">
                  <input type="range" id="unset-count-slider" min="0" max="20" value="3" />
                  <input type="number" id="unset-count" value="3" min="0" max="20" />
                </div>
              </div>
            </section>

            <section class="pane-panel" data-pane="members">
              <div class="pane-section-heading">
                <div class="inner-group-title" data-i18n="users">Member Customization</div>
                <button id="add-user" class="btn btn-secondary btn-sm" data-i18n="addUser">+ Add Member Setting</button>
              </div>

              <div class="settings-toolbar">
                <div class="toolbar-item grow">
                  <label class="mini-label" data-i18n="unlistedMembers">Unlisted</label>
                  <div class="toggle-group" id="unlisted-toggle-group">
                    <button type="button" class="toggle-btn active" data-value="show" data-i18n="unlistedShow">Show</button>
                    <button type="button" class="toggle-btn" data-value="hide" data-i18n="unlistedHide">Hide (Whitelist)</button>
                  </div>
                </div>
                <div class="toolbar-item sort-item">
                  <label for="unset-priority" class="mini-label" data-i18n="unsetPriority">Unset Sort</label>
                  <input type="number" id="unset-priority" value="100" />
                </div>
                <div class="toolbar-item">
                  <label class="mini-label" data-i18n="defaultColor">Color</label>
                  <input type="color" id="default-color" value="#ffffff" />
                </div>
              </div>

              <input type="file" id="avatar-upload-base" accept="image/*" style="display: none;" />
              <div id="user-list" class="user-card-list">
                <!-- User inputs will be injected here -->
              </div>
            </section>

            <section class="pane-panel" data-pane="output">
              <div class="pane-section-heading">
                <div class="inner-group-title" data-i18n="groupCss">CSS Output</div>
                <button id="copy-css" class="btn-icon" title="Copy CSS">
                  <svg class="app-icon" aria-hidden="true" viewBox="0 0 24 24"><rect x="9" y="9" width="10" height="10" rx="2"/><path d="M5 15V7a2 2 0 0 1 2-2h8"/></svg>
                </button>
              </div>
              <pre id="css-output" class="sidebar-css-preview"></pre>
            </section>
          </div>
        </div>

        <footer class="sidebar-footer">
          <div class="input-field horizontal">
            <label for="file-prefix">File Prefix</label>
            <input type="text" id="file-prefix" value="20260109" />
          </div>
          <div class="footer-group">
            <div class="footer-group-label" data-i18n="labelSave">Save</div>
            <div class="footer-row-icons">
              <button id="save-bundle" class="btn-icon" title="Save CSS + Settings">
                <svg class="app-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M12 4v10"/><path d="m8 10 4 4 4-4"/><path d="M5 20h14"/></svg>
              </button>
            </div>
          </div>

          <div class="footer-group">
            <div class="footer-group-label" data-i18n="labelLoad">Load</div>
            <div class="footer-row-icons">
              <button id="import-json-btn" class="btn-icon" title="Load .json">
                <svg class="app-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M12 20V10"/><path d="m8 14 4-4 4 4"/><path d="M5 4h14"/></svg>
              </button>
            </div>
            <input type="file" id="import-json-input" accept=".json,.zip,application/json,application/zip" style="display: none;" />
          </div>
        </footer>
      </aside>

      <main class="preview-area">
        <header class="property-bar">
          <div class="property-group">
            <div class="input-field compact">
              <label for="avatar-size" data-i18n="avatarSize">Avatar Size</label>
              <div class="dual-input">
                <input type="range" id="avatar-size-slider" min="32" max="300" value="100" />
                <input type="number" id="avatar-size" value="100" min="32" max="300" />
              </div>
            </div>
            <div class="input-field compact">
              <label for="base-font-size" data-i18n="baseFontSize">Font Size</label>
              <div class="dual-input">
                <input type="range" id="base-font-size-slider" min="8" max="48" value="14" />
                <input type="number" id="base-font-size" value="14" min="8" max="48" />
              </div>
            </div>
            <div class="input-field compact">
              <label for="border-radius" data-i18n="borderRadius">Border Radius</label>
              <div class="dual-input">
                <input type="range" id="border-radius-slider" min="0" max="50" value="0" />
                <input type="number" id="border-radius" value="0" min="0" max="50" />
              </div>
            </div>
            <div class="input-field compact">
              <label for="container-padding" data-i18n="containerPadding">Container Padding</label>
              <div class="dual-input">
                <input type="range" id="container-padding-slider" min="0" max="100" value="20" />
                <input type="number" id="container-padding" value="20" min="0" max="100" />
              </div>
            </div>
          </div>

          <div class="property-group compact-options">
            <div class="input-field mini-control">
              <label for="layout-gap" data-i18n="spacing">Spacing</label>
              <div class="dual-input">
                <input type="range" id="layout-gap-slider" min="-50" max="200" value="0" />
                <input type="number" id="layout-gap" value="0" min="-50" max="200" />
              </div>
            </div>
            <div class="input-field mini-control layout-toggle-control">
              <label for="layout-direction" data-i18n="direction">Dir</label>
              <div class="toggle-group" id="layout-direction-group">
                <button type="button" class="toggle-btn icon-toggle active" data-value="row" title="Horizontal">
                  <svg class="app-icon" aria-hidden="true" viewBox="0 0 24 24"><rect x="4" y="7" width="6" height="10" rx="1.5"/><rect x="14" y="7" width="6" height="10" rx="1.5"/></svg>
                </button>
                <button type="button" class="toggle-btn icon-toggle" data-value="column" title="Vertical">
                  <svg class="app-icon" aria-hidden="true" viewBox="0 0 24 24"><rect x="7" y="4" width="10" height="6" rx="1.5"/><rect x="7" y="14" width="10" height="6" rx="1.5"/></svg>
                </button>
              </div>
            </div>
            <div class="input-field mini-control layout-toggle-control">
              <label for="layout-wrap" data-i18n="wrap">Wrap</label>
              <div class="toggle-group" id="layout-wrap-group">
                <button type="button" class="toggle-btn icon-toggle active" data-value="nowrap" title="No Wrap">
                  <svg class="app-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 8h16"/><path d="M4 12h16"/><path d="M4 16h10"/><path d="m17 14 3 3"/><path d="m20 14-3 3"/></svg>
                </button>
                <button type="button" class="toggle-btn icon-toggle" data-value="wrap" title="Wrap">
                  <svg class="app-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M4 11h13a3 3 0 0 1 0 6h-3"/><path d="m16 14-3 3 3 3"/><path d="M4 17h5"/></svg>
                </button>
              </div>
            </div>
            <div class="input-field mini-control layout-toggle-control align-toggle-control">
              <label for="layout-align" data-i18n="alignment">Align</label>
              <div class="toggle-group" id="layout-align-group">
                <button type="button" class="toggle-btn icon-toggle active" data-value="flex-start" title="Start">
                  <svg class="app-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M5 4v16"/><rect x="9" y="7" width="10" height="4" rx="1"/><rect x="9" y="13" width="7" height="4" rx="1"/></svg>
                </button>
                <button type="button" class="toggle-btn icon-toggle" data-value="center" title="Center">
                  <svg class="app-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M12 4v16"/><rect x="6" y="7" width="12" height="4" rx="1"/><rect x="8" y="13" width="8" height="4" rx="1"/></svg>
                </button>
                <button type="button" class="toggle-btn icon-toggle" data-value="flex-end" title="End">
                  <svg class="app-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M19 4v16"/><rect x="5" y="7" width="10" height="4" rx="1"/><rect x="8" y="13" width="7" height="4" rx="1"/></svg>
                </button>
              </div>
            </div>
            <div class="input-field mini-control color-control">
              <label for="background-color" data-i18n="backgroundColor">Background Color</label>
              <input type="color" id="background-color" value="#000000" />
            </div>
            <div class="input-field mini-control color-control">
              <label for="name-background-color" data-i18n="nameBackgroundColor">Name Background</label>
              <input type="color" id="name-background-color" value="#1e2024" />
            </div>
            <div class="input-field mini-control">
              <label for="show-names" data-i18n="showNames">Show Names</label>
              <button id="show-names" class="switch-control compact-switch" type="button" role="switch" aria-checked="true">
                <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
              </button>
            </div>
            <div class="input-field mini-control">
              <label for="shadow-enabled" data-i18n="shadowEnabled">Shadow</label>
              <button id="shadow-enabled" class="switch-control compact-switch" type="button" role="switch" aria-checked="true">
                <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
              </button>
            </div>
            <div id="theme-animation-settings" class="theme-animation-settings">
              <!-- Theme-specific animation settings will be injected here -->
            </div>
          </div>
        </header>
        <div class="preview-container" id="tab-live">
          <div class="preview-inner">
            <div id="discord-simulator" class="discord-simulator">
              <!-- Discord UI simulation will be injected here -->
            </div>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
